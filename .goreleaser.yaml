project_name: intentra

builds:
  - main: .
    binary: intentra
    ldflags:
      - -s -w
      - -X github.com/crvgilbertson/intentra/internal.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: crvgilbertson
    name: intentra

brews:
  - repository:
      owner: crvgilbertson
      name: homebrew-intentra
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    homepage: https://github.com/crvgilbertson/intentra
    description: Deterministic AI-powered commit planning engine
    install: |
      bin.install "intentra"
