version: 2

project_name: intentra

builds:
  - main: .
    binary: intentra
    ldflags:
      - -s -w
      - -X github.com/crvgilbertson/intentra/internal.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: crvgilbertson
    name: intentra

homebrew_casks:
  - repository:
      owner: crvgilbertson
      name: homebrew-intentra
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    homepage: https://github.com/crvgilbertson/intentra
    description: Deterministic AI-powered commit planning engine
    binaries:
      - intentra
