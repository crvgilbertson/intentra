name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 120s

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Version injection
        run: |
          go build -ldflags "-X github.com/crvgilbertson/intentra/internal.Version=ci-test" -o intentra .
          ./intentra --version | grep -q "ci-test" || { echo "FAIL: --version did not contain injected value"; exit 1; }
          echo "Version injection verified."

      - name: Architecture boundaries
        run: go run scripts/check-imports.go

      - name: Schema discipline
        run: |
          grep -q 'CurrentSchemaVersion' engine/models/commit_plan.go \
            || { echo "FAIL: CurrentSchemaVersion not found in commit_plan.go"; exit 1; }

          grep -q 'SchemaVersion.*CurrentSchemaVersion' engine/planners/commit_planner.go \
            || { echo "FAIL: assemblePlan does not set SchemaVersion"; exit 1; }

          grep -q 'SchemaVersion.*CurrentSchemaVersion' cmd/plan.go \
            || { echo "FAIL: loadCachedPlan does not validate SchemaVersion"; exit 1; }

          echo "Schema discipline checks passed."
