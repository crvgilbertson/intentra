name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.6.1)"
        required: true
      prerelease:
        description: "Pre-release suffix (e.g. rc1). Leave empty for stable."
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.8"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 120s

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Architecture boundaries
        run: go run scripts/check-imports.go

  tag:
    name: Create Tag
    needs: [verify]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: version must be semver (e.g. 0.6.1), got: $VERSION"
            exit 1
          fi

      - name: Ensure running on main
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "main" ]; then
            echo "FAIL: releases must be cut from main, got: $BRANCH"
            exit 1
          fi

      - name: Build tag name
        id: tag
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          SUFFIX="${{ github.event.inputs.prerelease }}"
          if [ -n "$SUFFIX" ]; then
            VERSION="${VERSION}-${SUFFIX}"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagging as $VERSION"

      - name: Ensure tag does not already exist
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "FAIL: tag $TAG already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

  goreleaser:
    name: Build & Publish
    needs: [verify, tag]
    if: always() && needs.verify.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.8"

      - name: Verify release secrets
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "FAIL: GITHUB_TOKEN is required for release publishing"
            exit 1
          fi
          if [ -z "${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}" ]; then
            echo "FAIL: HOMEBREW_TAP_GITHUB_TOKEN is required for Homebrew publishing"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  smoke-test:
    name: Release Smoke Test
    needs: [tag, goreleaser]
    if: always() && needs.goreleaser.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ needs.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          ASSET="intentra_${TAG#v}_linux_amd64.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET"
          tar xzf "$ASSET"
          REPORTED=$(./intentra --version 2>&1)
          if ! echo "$REPORTED" | grep -q "${TAG#v}"; then
            echo "FAIL: expected version ${TAG#v}, got: $REPORTED"
            exit 1
          fi
          echo "Smoke test passed: $REPORTED"

      - name: Verify Windows asset exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          ASSET="intentra_${TAG#v}_windows_amd64.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET"
          test -f "$ASSET" || { echo "FAIL: missing $ASSET"; exit 1; }
          echo "Windows asset present: $ASSET"
