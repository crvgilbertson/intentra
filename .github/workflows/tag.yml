name: tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.5.2)"
        required: true
      prerelease:
        description: "Pre-release suffix (e.g. rc1). Leave empty for stable."
        required: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: version must be semver (e.g. 0.5.2), got: $VERSION"
            exit 1
          fi

      - name: Ensure running on main
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "main" ]; then
            echo "FAIL: tags must be created from main, got: $BRANCH"
            exit 1
          fi

      - name: Build tag name
        id: tag
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          SUFFIX="${{ github.event.inputs.prerelease }}"
          if [ -n "$SUFFIX" ]; then
            VERSION="${VERSION}-${SUFFIX}"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagging as $VERSION"

      - name: Ensure tag does not already exist
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "FAIL: tag $TAG already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"
